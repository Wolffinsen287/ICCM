<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión — Devocionales</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="devocionales-app">
  <a class="skip-link" href="#login-card">Saltar al formulario</a>

  <header class="site-header">
    <nav class="nav" aria-label="Navegación principal">
      <div class="container nav__inner">
        <a class="nav__brand" href="../index.html" aria-label="Ir a inicio">
          <img class="nav__logo" src="../images/ICCMLogo.jpg" alt="Logo ICCM" width="44" height="44" />
          <span class="nav__title">ICCMazatlán</span>
        </a>

        <button class="nav__toggle" type="button" aria-label="Abrir menú" aria-controls="navMenu" aria-expanded="false">
          <span class="nav__toggle-lines" aria-hidden="true"></span>
        </button>

        <div class="nav__menu" id="navMenu">
          <ul class="nav__links">
            <li><a class="nav__link" href="index.html">Devocionales</a></li>
            <li><a class="nav__link" href="../index.html">Volver al sitio</a></li>
            <li class="nav__auth">
              <a id="nav-login-btn" class="btn btn--primary btn--sm" href="login.html">Iniciar sesión</a>
              <a id="nav-profile-btn" class="btn btn--ghost btn--sm hidden" href="perfil.html">Perfil</a>
              <button id="nav-logout-btn" class="btn btn--ghost btn--sm hidden" type="button">Cerrar sesión</button>
            </li>
            <li class="nav__cta"><a class="btn btn--primary btn--sm" href="#list">Explorar</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container" style="padding:2rem 1rem">
    <div id="login-card" class="card" style="max-width:480px;margin:0 auto">
      <h2 style="margin-top:0">Iniciar sesión</h2>
      <p class="muted">Accede para guardar notas y marcar devocionales como leídos.</p>

      

      <form id="login-form" style="margin-top:1rem">
        <label class="muted" for="login-email">Correo electrónico</label>
        <input id="login-email" type="email" placeholder="tu@correo.com" required style="width:100%;padding:.85rem;border-radius:10px;border:1px solid var(--c-border);margin-top:.35rem" />

        <label class="muted" for="login-password" style="margin-top:.6rem">Contraseña</label>
        <input id="login-password" type="password" placeholder="Contraseña" required style="width:100%;padding:.85rem;border-radius:10px;border:1px solid var(--c-border);margin-top:.35rem" />

        <div class="btn-row" style="margin-top:1rem">
          <button id="login-btn" type="button" class="btn btn--primary">Iniciar Sesión</button>
          <a id="forgot" href="#" class="btn btn--ghost">¿Olvidaste tu contraseña?</a>
        </div>
        <p class="muted" style="margin-top:.75rem">¿No tienes cuenta? <a id="link-show-register" href="#" style="font-weight:700">Crear cuenta</a></p>
      </form>

      <form id="register-form" class="hidden" style="margin-top:1rem">
        <label class="muted" for="reg-name">Nombre completo</label>
        <input id="reg-name" placeholder="Nombre completo" required style="width:100%;padding:.85rem;border-radius:10px;border:1px solid var(--c-border);margin-top:.35rem" />

        <label class="muted" for="reg-email" style="margin-top:.6rem">Correo electrónico</label>
        <input id="reg-email" type="email" placeholder="tu@correo.com" required style="width:100%;padding:.85rem;border-radius:10px;border:1px solid var(--c-border);margin-top:.35rem" />

        <label class="muted" for="reg-password" style="margin-top:.6rem">Contraseña</label>
        <input id="reg-password" type="password" placeholder="Contraseña" required style="width:100%;padding:.85rem;border-radius:10px;border:1px solid var(--c-border);margin-top:.35rem" />

        <div class="btn-row" style="margin-top:1rem">
          <button id="register-btn" type="button" class="btn btn--primary">Crear Cuenta</button>
        </div>
        <p class="muted" style="margin-top:.75rem">¿Ya tienes cuenta? <a id="link-show-login" href="#" style="font-weight:700">Iniciar sesión</a></p>
      </form>
    </div>
  </main>

  <script type="module" src="../js/devocionales.js"></script>
</body>
</html>
